# The app's database and API, as Supabase runs them, for the integration tests
# (scripts/test-integration.sh, docs/adr/0018). Nothing here is for production.
name: youoke-test

services:
  db:
    image: postgres:16
    environment:
      # A throwaway database reachable only from this machine: no password to keep.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["./init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator@db:5432/postgres
      PGRST_DB_SCHEMAS: karaoke
      PGRST_DB_ANON_ROLE: anon
      # Generated for each run by scripts/test-integration.sh, which signs the anon key with it.
      PGRST_JWT_SECRET: ${JWT_SECRET:?set by scripts/test-integration.sh}

  api:
    image: nginx:1.27-alpine
    depends_on: [rest]
    ports: ["127.0.0.1:54321:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
